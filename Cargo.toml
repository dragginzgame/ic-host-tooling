[workspace]
members = ["crates/ic-build"]
resolver = "3"

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/dragginzgame/ic-build"
description = "Cargo and Wasm builds, exact inputs and retained artifact caches"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
# Production dependencies
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-host-artifacts = { version = "0.30", default-features = false }
ic-host-fs = { version = "0.30", default-features = false }
ic-host-process = { version = "0.30", default-features = false }
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
toml = "1"
toml_edit = "0.25.17"
# Tests and tooling only: no exclusive entries; dev uses inherit this catalog.

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace]
members = [
    "crates/ic-host-artifacts",
    "crates/ic-host-fs",
    "crates/ic-host-process",
    "crates/ic-host-tools",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.12.5"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-host-tooling"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Host-side artifact, filesystem, process and IC tooling"

[workspace.dependencies]
# Registry versions are compatible ranges; Cargo.lock records exact build selections.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ic-host-artifacts = { path = "crates/ic-host-artifacts", version = "0.12", default-features = false }
ic-host-fs = { path = "crates/ic-host-fs", version = "0.12", default-features = false }
ic-host-process = { path = "crates/ic-host-process", version = "0.12", default-features = false }
ic-host-tools = { path = "crates/ic-host-tools", version = "0.12", default-features = false }
libc = "0.2.190"
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
wasmparser = { version = "0.261.0", default-features = false, features = ["std", "features"] }

[workspace.lints.rust]
missing_docs = "warn"
# One reviewed macOS process-group query locally permits its native FFI call.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

name: Retain IC Tooling qualification evidence
description: Archive product diagnostics separately from common tool evidence.
runs:
  using: composite
  steps:
    - id: archive
      shell: bash
      run: |
        destination="$(mktemp -d "$RUNNER_TEMP/product-evidence.XXXXXX")"
        status=0
        bash "$GITHUB_WORKSPACE/scripts/ci/archive-product-evidence.sh" \
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$destination/evidence.tar.gz" \
          > "$destination/collection.log" 2>&1 || status=$?
        echo "path=$destination" >> "$GITHUB_OUTPUT"
        cat "$destination/collection.log"
        exit "$status"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && !cancelled() && steps.archive.outputs.path != '' }}
      with:
        name: product-evidence-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
        path: ${{ steps.archive.outputs.path }}
        compression-level: 0
        retention-days: 14
        if-no-files-found: error

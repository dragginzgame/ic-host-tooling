name: Prepare common tools
# Shared companions: make/consumer.mk scripts/ci/cargo-tool-cache-key.sh
description: Install and check the selected complete toolset, retaining logs and publishing PATH.
inputs:
  cache:
    description: Restore exact Cargo tool generations before normal setup/admission.
    default: 'false'
  cache-save:
    description: Allow saving after successful setup on default-branch pushes only.
    default: 'false'
  cache-extra-key:
    description: Consumer fingerprint of selected product-tool recipes/pins; no secrets.
    default: ''
  rust-tool-versions:
    description: Explicit common Rust catalog exception; defaults to this snapshot.
    default: ''
runs:
  using: composite
  steps:
    - id: cache-options
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        CACHE: ${{ inputs.cache }}
        CACHE_SAVE: ${{ inputs.cache-save }}
        CACHE_EXTRA: ${{ inputs.cache-extra-key }}
      run: |
        case "$CACHE:$CACHE_SAVE" in false:false|true:false|true:true) ;; *) echo 'Invalid cache selection' >&2; exit 2 ;; esac
        case "$CACHE_EXTRA" in *$'\r'*|*$'\n'*) echo 'Invalid cache extra key' >&2; exit 2 ;; esac
    - id: tool-cache-key
      if: inputs.cache == 'true'
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        ACTION_ROOT: ${{ github.action_path }}
        RUST_CATALOG: ${{ inputs.rust-tool-versions }}
      run: |
        make --no-print-directory install-host-tools
        make --no-print-directory host-tools-check
        export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
        bash "$ACTION_ROOT/../../../scripts/ci/cargo-tool-cache-key.sh" \
          "${RUST_CATALOG:-$ACTION_ROOT/../../../ci/tool-versions.env}" >> "$GITHUB_OUTPUT"
    - id: tool-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      with:
        path: |
          ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
          ${{ steps.tool-cache-key.outputs.root }}/rust-*
        key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}-${{ inputs.cache-extra-key }}
    - id: prepare-tools
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      run: |
        make install-tools 2>&1 | tee "$RUNNER_TEMP/tools-install.log"
        make tools-check 2>&1 | tee "$RUNNER_TEMP/tools-check.log"
        {
          echo "$GITHUB_WORKSPACE/.tools/host/bin"
          echo "$GITHUB_WORKSPACE/.tools/rust/common/bin"
        } >> "$GITHUB_PATH"
    - id: save-tool-cache
      if: inputs.cache == 'true' && inputs.cache-save == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.tool-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: |
          ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
          ${{ steps.tool-cache-key.outputs.root }}/rust-*
        key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}-${{ inputs.cache-extra-key }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Preserve native qualification of each pushed source, including queued jobs.
  # Superseded PR revisions can still be cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "$(uname -s)" == "$EXPECTED_OS" ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCHITECTURE" ]]
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            [[ "$(sw_vers -productVersion)" == 15.* ]]
            echo /bin >> "$GITHUB_PATH"
          fi
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Prepare locked dependency cache
        run: cargo fetch --locked
      - name: Prepare pinned manifest formatter
        run: |
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" --locked
      - name: Prepare pinned local tools
        run: |
          make --no-print-directory install-host-tools
          make --no-print-directory host-tools-check
          echo "$PWD/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$PWD/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Run native CI
        run: CARGO_NET_OFFLINE=true make ci
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: native-failure-${{ matrix.runner }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
      - name: Prepare locked dependency cache
        run: cargo fetch --locked
      - name: Check declared MSRV
        run: |
          for package in ic-host-artifacts ic-host-fs ic-host-process ic-host-tools; do
            CARGO_NET_OFFLINE=true make msrv PACKAGE="$package"
          done

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned validation tools
        run: make install-validation-tools
      - name: Check shell and workflow sources and scan history
        run: make lint check-secrets

  wasm-optimizer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare retained qualification directory
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-qualification"
          echo "TMPDIR=$RUNNER_TEMP/wasm-qualification" >> "$GITHUB_ENV"
      - name: Prepare declared compiler
        run: rustup toolchain install --profile minimal --no-self-update
      - name: Prepare and admit native optimizer tools
        run: |
          make install-host-tools 2>&1 | tee "$TMPDIR/host-tools-install.log"
          make install-ic-tools 2>&1 | tee "$TMPDIR/ic-tools-install.log"
          make host-tools-check ic-tools-check
      - name: Prepare pinned Wasm execution runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Prepare locked dependencies
        run: cargo fetch --locked 2>&1 | tee "$TMPDIR/dependencies-fetch.log"
      - name: Qualify native artifact transforms
        run: |
          optimizer="$(bash scripts/dev/install-ic-tools.sh --check)"
          bash scripts/ci/qualify-wasm-opt.sh "$optimizer/wasm-opt" "$RUNNER_TEMP/wasm-qualification/optimizer"
      - name: Retain failed native qualification
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: wasm-optimizer-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}/wasm-qualification
          repository-root: ${{ github.workspace }}

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare temporary evidence directory
        run: |
          task_tmpdir="$RUNNER_TEMP/bootstrap-validation"
          mkdir -p "$task_tmpdir"
          echo "TMPDIR=$task_tmpdir" >> "$GITHUB_ENV"
      - name: Prepare the declared development toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --target wasm32-unknown-unknown --no-self-update
      - name: Prepare the complete common toolset
        run: make install-tools 2>&1 | tee "$TMPDIR/tools-install.log"
      - name: Prepare the declared minimum compiler
        run: |
          task_msrv="$(.tools/host/bin/yq -p toml -o json -r '.workspace.package."rust-version"' Cargo.toml)"
          rustup toolchain install "$task_msrv" --profile minimal --no-self-update
      - name: Prepare the locked workspace dependency cache
        run: cargo fetch --locked 2>&1 | tee "$TMPDIR/dependencies-fetch.log"
      - name: Run the bootstrap gate
        run: make ci
      - name: Retain failed validation and installer evidence
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: bootstrap-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}/bootstrap-validation
          repository-root: ${{ github.workspace }}

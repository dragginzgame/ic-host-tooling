name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  lint-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned validation tools
        run: make install-validation-tools
      - name: Check shell and workflow sources and scan history
        run: make lint check-secrets

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          host_arguments=("$EXPECTED_OS" "$EXPECTED_ARCHITECTURE")
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            host_arguments+=(15)
          fi
          bash scripts/ci/check-native-host.sh "${host_arguments[@]}"
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            echo /bin >> "$GITHUB_PATH"
          fi
      - name: Prepare declared development compiler and Wasm target
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
      - name: Prepare locked dependency cache
        run: cargo fetch --locked
      - name: Prepare host tools and identify Cargo tool cache
        id: tool-cache-key
        run: |
          make --no-print-directory install-host-tools
          make --no-print-directory host-tools-check
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash scripts/ci/cargo-tool-cache-key.sh ci/tool-versions.env >> "$GITHUB_OUTPUT"
      - name: Restore Cargo tool builds
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.tool-cache-key.outputs.root }}/rust-*
          # The shared identity covers the selected common formatter tools.
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}-${{ hashFiles('ci/release-editor.env') }}
      - name: Prepare pinned local tools
        uses: ./.github/actions/prepare-common-tools
      - name: Save admitted Cargo tool builds
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ${{ steps.tool-cache-key.outputs.root }}/cargo-cache
            ${{ steps.tool-cache-key.outputs.root }}/rust-*
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-cache-key.outputs.key }}-${{ hashFiles('ci/release-editor.env') }}
      - name: Run native CI
        env:
          TMPDIR: ${{ runner.temp }}/portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          CARGO_NET_OFFLINE=true make ci
      - name: Verify publication archives with registry access
        run: make publish-check
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: native-failure-${{ matrix.runner }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
      - name: Retain product qualification evidence
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/retain-product-evidence

  msrv:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
      - name: Prepare locked dependency cache
        run: cargo fetch --locked
      - name: Check declared MSRV
        run: CARGO_NET_OFFLINE=true make msrv-qualification

[package]
name = "ic-build"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
repository.workspace = true
description = "Cargo and Wasm builds, exact inputs and retained artifact caches"
readme = "README.md"
license.workspace = true
exclude = ["target/"]
publish = ["crates-io"]

[[bin]]
name = "ic-build-release-metadata"
path = "src/bin/ic-build-release-metadata.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap"]

[target.'cfg(unix)'.dependencies]
# Production dependencies
rustix = { workspace = true, features = ["process"] }

[dependencies]
# Production dependencies
cargo_metadata.workspace = true
clap = { workspace = true, optional = true }
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Tests and tooling only
ic-host-process = { workspace = true, features = ["test-support"] }

[dev-dependencies]
# Tests and tooling only
clap.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }

[[test]]
name = "release_metadata_cli"
required-features = ["cli"]

[lints]
workspace = true

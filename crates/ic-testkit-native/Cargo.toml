[package]
publish = ["crates-io"]
name = "ic-testkit-native"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native allocation measurement and optional memory IO observations for tests"
readme = "README.md"

[features]
stable-memory = ["dep:ic-platform", "ic-platform/stable-structures"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-platform = { workspace = true, optional = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
enum_variant_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

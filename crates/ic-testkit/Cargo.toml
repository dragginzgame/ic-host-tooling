[package]
name = "ic-testkit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
wire = ["dep:ic-wire"]

[dependencies]
ic-metrics = { workspace = true }
ic-platform = { workspace = true }

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-host-artifacts = { workspace = true, features = ["gzip"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-platform = { workspace = true, features = ["candid"] }
ic-wire = { workspace = true, optional = true }
pocket-ic = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform = { workspace = true, features = ["ic0"] }

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dev-dependencies]
ic-host-process = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

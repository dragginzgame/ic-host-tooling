[package]
name = "ic-testkit-dev"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
clap = { workspace = true, features = ["string"] }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true }
ic-host-fs = { workspace = true, features = ["temporary-file"] }
ic-host-process = { workspace = true }
ic-host-text = { workspace = true }
ic-platform = { workspace = true }
ic-testkit = { workspace = true, features = ["wire"] }
ic-testkit-perf-probe = { workspace = true }
ic-wire = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
enum_variant_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

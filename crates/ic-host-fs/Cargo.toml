[package]
name = "ic-host-fs"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local host filesystem reads, durable publication, file locking and a bounded file CLI"
readme = "../../README.md"
publish = ["crates-io"]

[[bin]]
name = "ic-host-file"
path = "src/bin/ic-host-file/main.rs"
required-features = ["cli"]

[features]
default = []
capability = ["dep:cap-fs-ext", "dep:cap-std"]
cli = ["dep:clap"]
temporary-file = ["dep:tempfile"]
test-support = []

[target.'cfg(unix)'.dependencies]
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
rustix.workspace = true
tempfile = { workspace = true, optional = true }

[dependencies]
clap = { workspace = true, optional = true }
ic-host-artifacts.workspace = true
thiserror.workspace = true

[dev-dependencies]
clap.workspace = true
ic-host-artifacts = { workspace = true, features = ["gzip"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "file_cli"
required-features = ["cli"]

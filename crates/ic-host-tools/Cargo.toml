[package]
name = "ic-host-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side Candid interfaces, ICP responses and certificate decoding"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
agent = ["dep:ic-agent", "dep:url"]
certificate = ["dep:ciborium", "dep:ic-certification"]
ic-interface = ["dep:ic-host-artifacts", "ic-host-artifacts/wasm"]

[dependencies]
candid_parser.workspace = true
ciborium = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-agent = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
ic-host-artifacts.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

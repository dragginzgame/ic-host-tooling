[package]
name = "ic-host-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side Candid extraction, ICP response decoding and IC resource reports"
readme = "../../README.md"
publish = ["crates-io"]

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[features]
default = ["candid-extraction"]
candid-extraction = ["dep:ic-host-artifacts", "dep:ic-host-fs", "dep:ic-host-process"]
ic-limits = ["dep:ic-host-artifacts", "ic-host-artifacts/wasm"]

[dependencies]
ic-host-artifacts = { workspace = true, optional = true }
ic-host-fs = { workspace = true, optional = true }
ic-host-process = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Only Candid extraction requires the process integration feature.
[[example]]
name = "extract_candid"
required-features = ["candid-extraction"]

[[example]]
name = "inspect_install_limits"
required-features = ["ic-limits"]

[package]
name = "ic-host-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side Candid interfaces, ICP responses and certificate decoding"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
agent = ["ic-platform/agent", "dep:url"]
certificate = ["dep:ciborium", "ic-platform/certification"]
encoding = []
ic-interface = ["dep:ic-host-artifacts", "ic-host-artifacts/wasm"]
icp-project = ["dep:serde_yaml_ng", "serde/derive"]
ledger-evidence = ["ic-platform/icrc-ledger-types", "serde/derive"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url = { workspace = true, optional = true }

[dependencies]
ciborium = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
ic-platform = { workspace = true, features = ["candid", "candid-parser"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
ic-host-artifacts.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

leb128.workspace = true

[lints]
workspace = true

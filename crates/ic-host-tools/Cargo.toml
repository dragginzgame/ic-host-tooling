[package]
name = "ic-host-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side Candid interfaces, ICP responses and certificate decoding"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
agent = ["dep:ic-platform", "ic-platform/agent", "dep:url"]
candid = ["dep:ic-platform", "ic-platform/candid", "ic-platform/candid-parser"]
certificate = ["dep:ic-platform", "dep:minicbor", "ic-platform/certification"]
encoding = []
ic-interface = ["dep:ic-host-artifacts", "ic-host-artifacts/wasm"]
icp-project = ["dep:serde_yaml_ng", "serde/derive"]
ledger-evidence = [
    "dep:ic-platform",
    "ic-platform/candid",
    "ic-platform/icrc-ledger-types",
    "serde/derive",
]
registry = ["dep:ic-platform", "dep:prost"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
url = { workspace = true, optional = true }

[dependencies]
ic-host-artifacts = { workspace = true, optional = true }
ic-platform = { workspace = true, optional = true }
minicbor = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
ic-host-artifacts.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
serde_cbor.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

leb128.workspace = true

[lints]
workspace = true

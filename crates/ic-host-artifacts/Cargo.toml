[package]
name = "ic-host-artifacts"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded host artifact streams, identities, gzip and Wasm inspection"
readme = "../../README.md"
publish = ["crates-io"]

[features]
default = []
gzip = ["dep:flate2"]
wasm = ["dep:leb128", "dep:wasmparser"]
wasm-validation = ["wasm", "wasmparser/validate"]

[dependencies]
flate2 = { workspace = true, optional = true }
leb128 = { workspace = true, optional = true }
sha2.workspace = true
wasmparser = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "consumer_contracts"
required-features = ["wasm"]
